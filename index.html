function ctl(){var a=document.getElementById("adm"),d=document.getElementById("adlg");a.textContent=L(U.admin);document.getElementById("lang").setAttribute("aria-checked",lang==="en");d.querySelector("h3").textContent=L(U.adminTitle);d.querySelector("p").textContent=L(U.adminMsg);d.querySelector("[data-act=reset]").textContent=L(U.resetPos);d.querySelector("[data-act=close]").textContent=L(U.close);if(window.layoutCtl)layoutCtl();if(window.navSpy)navSpy(true)}
(function(){
 var LNG=document.getElementById("lang"),ADM=document.getElementById("adm"),DLG=document.getElementById("adlg"),SP=document.getElementById("sp"),M=10,pos={},blocked=false;
 try{pos=JSON.parse(localStorage.getItem("uiPos2")||"{}")||{}}catch(e){pos={}}
 function vp(){var c=getComputedStyle(SP);return{w:document.documentElement.clientWidth,h:innerHeight,st:parseFloat(c.paddingTop)||0,sr:parseFloat(c.paddingRight)||0,sb:parseFloat(c.paddingBottom)||0,sl:parseFloat(c.paddingLeft)||0}}
 function ok(p){return p&&(p.s==="l"||p.s==="r")&&isFinite(p.y)}
 function put(p,v){var h=LNG.offsetHeight,y=Math.min(Math.max(p.y,v.st+M),Math.max(v.st+M,v.h-h-v.sb-M));p.y=y;LNG.style.top=y+"px";LNG.style.bottom="auto";if(p.s==="l"){LNG.style.left=(M+v.sl)+"px";LNG.style.right="auto"}else{LNG.style.right=(M+v.sr)+"px";LNG.style.left="auto"}}
 window.layoutCtl=function(){var v=vp(),p=ok(pos.lang)?pos.lang:{s:"l",y:document.querySelector("nav").offsetHeight+M};put(p,v);if(ok(pos.lang))pos.lang=p};
 function save(){try{localStorage.setItem("uiPos2",JSON.stringify({lang:pos.lang}))}catch(e){}}
 var sx,sy,ox,oy,on=false,down=false,pid;
 LNG.addEventListener("click",function(e){if(blocked){e.stopImmediatePropagation();e.preventDefault()}},true);
 LNG.addEventListener("pointerdown",function(e){if(e.button>0)return;down=true;on=false;sx=e.clientX;sy=e.clientY;var r=LNG.getBoundingClientRect();ox=r.left;oy=r.top;pid=e.pointerId});
 LNG.addEventListener("pointermove",function(e){if(!down)return;var dx=e.clientX-sx,dy=e.clientY-sy;if(!on&&Math.hypot(dx,dy)<8)return;if(!on){on=true;try{LNG.setPointerCapture(pid)}catch(x){}}
  var v=vp(),w=LNG.offsetWidth,h=LNG.offsetHeight,x=Math.min(Math.max(ox+dx,M),v.w-w-M),y=Math.min(Math.max(oy+dy,v.st+M),v.h-h-v.sb-M);LNG.style.left=x+"px";LNG.style.top=y+"px";LNG.style.right="auto"});
 function end(){if(!down)return;down=false;if(on){on=false;var r=LNG.getBoundingClientRect();pos.lang={s:(r.left+r.width/2<document.documentElement.clientWidth/2)?"l":"r",y:r.top};layoutCtl();save();blocked=true;setTimeout(function(){blocked=false},80)}}
 LNG.addEventListener("pointerup",end);LNG.addEventListener("pointercancel",end);
 ADM.addEventListener("click",function(){DLG.showModal()});
 DLG.addEventListener("click",function(e){if(e.target===DLG){DLG.close();return}var a=e.target.dataset&&e.target.dataset.act;if(a==="close")DLG.close();if(a==="reset"){pos={};try{localStorage.removeItem("uiPos2")}catch(x){}layoutCtl()}});
 addEventListener("resize",function(){layoutCtl()});addEventListener("orientationchange",function(){setTimeout(layoutCtl,200)});
 layoutCtl();
})();
(function(){var last=null,shown=false,tick=false;
 window.navSpy=function(instant){var nav=document.getElementById("nav"),nb=document.getElementById("nb");if(!nb)return;var ids=Object.keys(CONFIG.ui.nav),cur=null,line=document.querySelector("nav").offsetHeight+60;
  for(var i=0;i<ids.length;i++){var el=document.getElementById(ids[i]);if(el&&el.getBoundingClientRect().top<=line)cur=ids[i]}
  if(innerHeight+scrollY>=document.documentElement.scrollHeight-4)cur=ids[ids.length-1];
  var a=cur&&nav.querySelector('a[href="#'+cur+'"]');
  if(!a){nb.style.opacity=0;shown=false;last=null;nav.querySelectorAll("a").forEach(function(x){x.classList.remove("on")});return}
  var jump=instant||!shown;if(jump)nb.style.transition="none";
  nb.style.opacity=1;nb.style.width=a.offsetWidth+"px";nb.style.transform="translateX("+a.offsetLeft+"px)";
  if(jump){void nb.offsetWidth;nb.style.transition=""}shown=true;
  nav.querySelectorAll("a").forEach(function(x){x.classList.toggle("on",x===a)});
  if(cur!==last){last=cur;try{nav.scrollTo({left:a.offsetLeft-nav.clientWidth/2+a.offsetWidth/2,behavior:"smooth"})}catch(e){}}};
 function onS(){if(tick)return;tick=true;requestAnimationFrame(function(){tick=false;navSpy(false)})}
 addEventListener("scroll",onS,{passive:true});addEventListener("resize",onS);navSpy(true)})();
